name: Native apps
on:
  push:
    branches: [main, work/native-daily-notes]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: native/ui
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml --no-default-features
      - run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: pin-native-linux
          path: native/target/release/pin-native
      - uses: actions/upload-artifact@v4
        with:
          name: pin-native-lock
          path: native/Cargo.lock
