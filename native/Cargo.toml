[package]
name = "pin-native"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Native floating priorities and scratch notes"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:gtk", "dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-clipboard-manager"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
gtk = { version = "0.18", optional = true }
tauri = { version = "=2.12.5", optional = true, features = ["image-png"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "pin-native"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
