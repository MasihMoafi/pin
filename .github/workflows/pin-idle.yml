name: Native Pin idle at desktop scales
on:
  push:
    branches: ['work/pin-speed-*']
    paths: ['.github/workflows/pin-idle.yml', 'native/test/idle.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  idle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43687825195 -n pin-iced-linux -D app
          chmod +x app/pin-iced
      - name: Install display dependencies
        run: sudo apt-get install -y -qq xvfb openbox xdotool x11-utils python3-pil libxkbcommon-x11-0 fonts-inter fonts-noto-core
      - name: Observe idle without generated input
        run: |
          Xvfb :99 -screen 0 3200x2400x24 -nolisten tcp &
          display_pid=$!
          wm_pid=''
          trap 'kill "$wm_pid" "$display_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          for attempt in $(seq 1 100); do
            xdpyinfo >/dev/null 2>&1 && break
            sleep .1
          done
          openbox &
          wm_pid=$!
          for attempt in $(seq 1 100); do
            xprop -root _NET_SUPPORTING_WM_CHECK | rg -q 'window id #' && break
            sleep .1
          done
          dbus-run-session -- /usr/bin/python3 -I native/test/idle.py app/pin-iced idle-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-idle
          path: idle-results
