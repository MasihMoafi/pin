[package]
name = "pin-native"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Native floating priorities and scratch notes"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:gtk", "dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-clipboard-manager"]
custom-protocol = ["tauri/custom-protocol"]
iced-ui = ["dep:iced", "dep:image", "dep:unicode-segmentation"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4"
gtk = { version = "0.18", optional = true }
tauri = { version = "=2.12.5", optional = true, features = ["image-png"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

iced = { version = "=0.14.0", optional = true, default-features = false, features = ["tiny-skia", "x11", "tokio", "svg", "linux-theme-detection", "crisp", "advanced"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

unicode-segmentation = { version = "1", optional = true }

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "pin-native"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "notes-iced"
path = "src/notes_iced.rs"
required-features = ["iced-ui"]

[[bin]]
name = "pin-iced"
path = "src/pin_iced.rs"
required-features = ["iced-ui"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
