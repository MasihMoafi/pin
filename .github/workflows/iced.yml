name: Native Iced apps
on:
  push:
    branches: [work/iced-notes, work/iced-pin, work/iced-pin-integrated, work/recording-fixes-20261110, 'work/notes-markdown-*', 'work/pin-speed-*']
    paths: ['native/**', '.github/workflows/iced.yml']
  workflow_dispatch:
    inputs:
      task_actions_only:
        description: Run task action and performance checks
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: iced-software
          cache-on-failure: true
      - run: cargo test --locked --manifest-path native/Cargo.toml --no-default-features --features iced-ui
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --no-default-features --features iced-ui --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path native/Cargo.toml --no-default-features --features iced-ui --bins --release
      - uses: actions/upload-artifact@v4
        with:
          name: notes-iced-linux
          path: native/target/release/notes-iced
      - uses: actions/upload-artifact@v4
        with:
          name: pin-iced-linux
          path: native/target/release/pin-iced
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-iced-lock
          path: native/Cargo.lock
      - name: Install desktop test dependencies
        timeout-minutes: 6
        run: |
          packages=(xvfb openbox picom xdotool x11-utils x11-xserver-utils xclip python3-pil ripgrep libxkbcommon-x11-0 fonts-inter fonts-noto-core libwebkit2gtk-4.1-0 libgtk-3-0)
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo timeout 90 apt-get "${apt_options[@]}" install -y -qq "${packages[@]}" || {
            sudo timeout 90 apt-get "${apt_options[@]}" update -qq
            sudo timeout 120 apt-get "${apt_options[@]}" install -y -qq "${packages[@]}"
          }
      - name: Download the verified WebView baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42611779863 -n pin-native-linux -D baseline
      - name: Download the verified native Pin baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42990075369 -n pin-iced-linux -D pin-baseline
      - name: Download the previous Pin presentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43692770691 -n pin-iced-linux -D presentation-baseline
      - name: Verify and compare real native apps on a hidden display
        env:
          PIN_TASK_ACTIONS_ONLY: ${{ inputs.task_actions_only || 'false' }}
        run: |
          Xvfb :99 -screen 0 3200x2400x24 -nolisten tcp &
          iced_display_pid=$!
          iced_wm_pid=''
          iced_compositor_pid=''
          trap 'kill "$iced_compositor_pid" "$iced_wm_pid" "$iced_display_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          for attempt in $(seq 1 100); do
            xdpyinfo >/dev/null 2>&1 && break
            sleep 0.1
          done
          xdpyinfo >/dev/null
          openbox &
          iced_wm_pid=$!
          for attempt in $(seq 1 100); do
            xprop -root _NET_SUPPORTING_WM_CHECK | rg -q 'window id #' && break
            sleep 0.1
          done
          xsetroot -solid '#7f7f7f'
          picom --backend xrender --no-vsync &
          iced_compositor_pid=$!
          sleep 1
          kill -0 "$iced_compositor_pid"
          export PIN_DISPLAY_PIDS="$iced_display_pid $iced_compositor_pid"
          chmod +x presentation-baseline/pin-iced
          dbus-run-session -- /usr/bin/python3 -I native/test/presentation.py presentation-baseline/pin-iced iced-results/presentation-baseline --baseline
          dbus-run-session -- /usr/bin/python3 -I native/test/presentation.py native/target/release/pin-iced iced-results/presentation-revised
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('iced-results/presentation-baseline/results.json').read_text())['cases'][-1]['cases']
          after = json.loads(Path('iced-results/presentation-revised/results.json').read_text())['cases'][-1]['cases']
          for name in ['typing', 'window', 'task']:
              old = before[name]['app_cpu_percent'] + before[name]['display_cpu_percent']
              new = after[name]['app_cpu_percent'] + after[name]['display_cpu_percent']
              assert new < old * .8, (name, old, new)
          print('PASS active CPU gate: typing, window movement and task dragging use at least 20 percent less combined app/display CPU at 2x')
          PY
          dbus-run-session -- /usr/bin/python3 -I native/test/subtasks.py native/target/release/pin-iced iced-results/subtasks
          ICED_TEST_SCALE=2 dbus-run-session -- /usr/bin/python3 -I native/test/subtasks.py native/target/release/pin-iced iced-results/subtasks-scale2
          if [[ "$PIN_TASK_ACTIONS_ONLY" == true ]]; then
            exit 0
          fi
          chmod +x pin-baseline/pin-iced
          dbus-run-session -- /usr/bin/python3 -I native/test/responsiveness.py pin-baseline/pin-iced iced-results/responsiveness-baseline
          dbus-run-session -- /usr/bin/python3 -I native/test/responsiveness.py native/target/release/pin-iced iced-results/responsiveness-revised
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('iced-results/responsiveness-baseline/measurements.json').read_text())['cases']
          revised = json.loads(Path('iced-results/responsiveness-revised/measurements.json').read_text())['cases']
          assert revised[0]['median_paint_ms'] <= baseline[0]['median_paint_ms'] * 1.2, (baseline[0], revised[0])
          assert revised[0]['burst_ms'] <= baseline[0]['burst_ms'] * 1.2, (baseline[0], revised[0])
          assert any(b['burst_ms'] < a['burst_ms'] * .8 and b['burst_cpu_s'] < a['burst_cpu_s'] for a, b in zip(baseline[1:], revised[1:])), (baseline, revised)
          large = revised[0]['movement']['1213']
          assert large['task']['cpu_percent_one_core'] <= 10, large
          assert large['hover']['cpu_percent_one_core'] <= 5, large
          print('PASS input speed gate: small lists retain latency; larger lists use less CPU and finish at least 20 percent faster')
          PY
          dbus-run-session -- /usr/bin/python3 -I native/test/text_bounds.py native/target/release/notes-iced iced-results/text-bounds
          dbus-run-session -- /usr/bin/python3 -I native/test/markdown.py native/target/release/notes-iced iced-results/markdown
          dbus-run-session -- /usr/bin/python3 -I native/test/pin_iced.py baseline/pin-native native/target/release/pin-iced iced-results/pin-scale1
          ICED_TEST_SCALE=2 dbus-run-session -- /usr/bin/python3 -I native/test/pin_iced.py baseline/pin-native native/target/release/pin-iced iced-results/pin-scale2
          dbus-run-session -- /usr/bin/python3 -I native/test/iced.py baseline/pin-native native/target/release/notes-iced iced-results/scale1
          ICED_TEST_SCALE=2 dbus-run-session -- /usr/bin/python3 -I native/test/iced.py baseline/pin-native native/target/release/notes-iced iced-results/scale2
          dbus-run-session -- /usr/bin/python3 -I native/test/idle.py native/target/release/pin-iced iced-results/idle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iced-notes-evidence
          path: iced-results
