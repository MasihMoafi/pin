name: Native Pin idle at desktop scales
on:
  workflow_dispatch:
    inputs:
      binary_run_id:
        description: Verified app artifact run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  idle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified app
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_BINARY_RUN: ${{ inputs.binary_run_id }}
        run: |
          gh run download "$PIN_BINARY_RUN" -n pin-iced-linux -D app
          chmod +x app/pin-iced
      - name: Install display dependencies
        run: |
          packages=(xvfb openbox xdotool x11-utils libxkbcommon-x11-0 fonts-inter fonts-noto-core)
          sudo timeout 90 apt-get install -y -qq "${packages[@]}" || {
            sudo timeout 90 apt-get update -qq
            sudo timeout 120 apt-get install -y -qq "${packages[@]}"
          }
      - name: Observe idle without generated input
        run: |
          Xvfb :99 -screen 0 3200x2400x24 -nolisten tcp &
          display_pid=$!
          wm_pid=''
          trap 'kill "$wm_pid" "$display_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          for attempt in $(seq 1 100); do
            xdpyinfo >/dev/null 2>&1 && break
            sleep .1
          done
          openbox &
          wm_pid=$!
          for attempt in $(seq 1 100); do
            xprop -root _NET_SUPPORTING_WM_CHECK | rg -q 'window id #' && break
            sleep .1
          done
          dbus-run-session -- /usr/bin/python3 -I native/test/idle.py app/pin-iced idle-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-idle
          path: idle-results
