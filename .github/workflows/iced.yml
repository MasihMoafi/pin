name: Native Iced apps
on:
  push:
    branches: [work/iced-notes, work/iced-pin, work/iced-pin-integrated, work/recording-fixes-20261110]
    paths: ['native/**', '.github/workflows/iced.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: iced-software
          cache-on-failure: true
      - run: cargo test --locked --manifest-path native/Cargo.toml --no-default-features --features iced-ui
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --no-default-features --features iced-ui --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path native/Cargo.toml --no-default-features --features iced-ui --bins --release
      - uses: actions/upload-artifact@v4
        with:
          name: notes-iced-linux
          path: native/target/release/notes-iced
      - uses: actions/upload-artifact@v4
        with:
          name: pin-iced-linux
          path: native/target/release/pin-iced
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-iced-lock
          path: native/Cargo.lock
      - name: Install desktop test dependencies
        timeout-minutes: 6
        run: |
          packages=(xvfb openbox picom xdotool x11-utils x11-xserver-utils xclip python3-pil ripgrep libxkbcommon-x11-0 fonts-inter fonts-noto-core libwebkit2gtk-4.1-0 libgtk-3-0)
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo timeout 90 apt-get "${apt_options[@]}" install -y -qq "${packages[@]}" || {
            sudo timeout 90 apt-get "${apt_options[@]}" update -qq
            sudo timeout 120 apt-get "${apt_options[@]}" install -y -qq "${packages[@]}"
          }
      - name: Download the verified WebView baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42611779863 -n pin-native-linux -D baseline
      - name: Verify and compare real native apps on a hidden display
        run: |
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp &
          iced_display_pid=$!
          iced_wm_pid=''
          iced_compositor_pid=''
          trap 'kill "$iced_compositor_pid" "$iced_wm_pid" "$iced_display_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          for attempt in $(seq 1 100); do
            xdpyinfo >/dev/null 2>&1 && break
            sleep 0.1
          done
          xdpyinfo >/dev/null
          openbox &
          iced_wm_pid=$!
          for attempt in $(seq 1 100); do
            xprop -root _NET_SUPPORTING_WM_CHECK | rg -q 'window id #' && break
            sleep 0.1
          done
          xsetroot -solid '#7f7f7f'
          picom --backend xrender --no-vsync &
          iced_compositor_pid=$!
          sleep 1
          kill -0 "$iced_compositor_pid"
          dbus-run-session -- /usr/bin/python3 -I native/test/pin_iced.py baseline/pin-native native/target/release/pin-iced iced-results/pin-scale1
          ICED_TEST_SCALE=2 dbus-run-session -- /usr/bin/python3 -I native/test/pin_iced.py baseline/pin-native native/target/release/pin-iced iced-results/pin-scale2
          dbus-run-session -- /usr/bin/python3 -I native/test/iced.py baseline/pin-native native/target/release/notes-iced iced-results/scale1
          ICED_TEST_SCALE=2 dbus-run-session -- /usr/bin/python3 -I native/test/iced.py baseline/pin-native native/target/release/notes-iced iced-results/scale2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iced-notes-evidence
          path: iced-results
